<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#3aa7e8">
<title>Avalon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Avalon">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="alternate icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='28' fill='%2342c94a' stroke='%23157a2c' stroke-width='5'/><text x='32' y='44' font-size='34' font-family='Arial' font-weight='bold' text-anchor='middle' fill='white'>A</text></svg>">
</head>
<body>
<canvas id="game"></canvas>

<!-- HUD -->
<div id="hud" class="hidden">
  <div class="hud-left">
    <div id="hud-hearts"></div>
    <div id="hud-hearts2" class="hidden"></div>
    <div class="hud-row"><div id="hud-lives"><canvas id="hud-life-ico"></canvas><canvas id="hud-life-ico2" class="hidden"></canvas><span id="hud-life-count">×3</span></div>
    <div id="hud-coins"><span class="coin-ico">A</span><span id="hud-coin-count">0</span></div></div>
  </div>
  <div id="hud-level"></div>
  <div class="hud-right">
    <button id="btn-ctrl" class="round-btn small-round hidden" aria-label="Knoppen tonen of verbergen"></button>
    <button id="btn-settings" class="round-btn small-round" aria-label="Instellingen"><svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.4 2.7a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.8 1.7 1L11 21h4l.4-2.7c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg></button>
    <button id="btn-pause" class="round-btn" aria-label="Pauze">❚❚</button>
  </div>
</div>
<div id="boss-bar" class="hidden"><div id="boss-name"></div><div class="bar"><div id="boss-fill"></div></div></div>
<div id="banner" class="hidden"></div>

<!-- Uitleg controller (in plaats van knoppen in beeld) -->
<div id="pad-legend" class="hidden">
  <span class="pl-item"><i class="pb pb-a">A</i>Springen</span>
  <span class="pl-item"><i class="pb pb-b">B</i>Wapen</span>
  <span class="pl-item"><i class="pb pb-y">Y</i><span id="pl-special">Special</span></span>
</div>

<!-- Touch controls -->
<div id="touch" class="hidden">
  <div class="pad-left">
    <div id="stick" aria-label="Lopen"><div id="stick-knob"></div></div>
  </div>
  <div class="pad-right">
    <button class="tbtn tbtn-special hidden" data-k="special" aria-label="Speciale aanval">★</button>
    <button class="tbtn tbtn-atk" data-k="attack" aria-label="Aanvallen">⚔</button>
    <button class="tbtn tbtn-jump" data-k="jump" aria-label="Springen">⤒</button>
  </div>
</div>

<!-- Screens -->
<div id="screens">

  <section id="scr-title" class="screen">
    <div class="title-wrap">
      <h1 class="logo">AVALON</h1>
      <p class="tagline">Red de mensen in vier werelden!</p>
      <div class="menu">
        <button class="big-btn" id="btn-play">Spelen</button>
        <button class="big-btn alt" id="btn-scores">Scorebord</button>
        <div class="sound-row">
          <button class="big-btn alt small" id="btn-music">🎵 Muziek aan</button>
          <button class="big-btn alt small" id="btn-sfx">🔊 Effecten aan</button>
        </div>
      </div>
      <p class="help desktop-only">Laptop: ← → lopen · spatie springen · X of J aanvallen · C of L speciaal · Esc pauze</p>
      <p class="help pad-only hidden" id="pad-help">🎮 Controller: A springen · B wapen · Y special · Menu pauze</p>
    </div>
  </section>

  <section id="scr-chars" class="screen hidden">
    <header class="scr-head">
      <button class="round-btn back" data-back="title" aria-label="Terug">←</button>
      <h2 id="chars-title">Kies je personage</h2>
    </header>
    <div id="char-grid" class="char-grid"></div>
    <div class="char-detail" id="char-detail"></div>
  </section>

  <section id="scr-worlds" class="screen hidden">
    <header class="scr-head">
      <button class="round-btn back" data-back="chars" aria-label="Terug">←</button>
      <div><h2>Kies een wereld</h2><div class="scr-sub" id="world-sub"></div></div>
    </header>
    <div id="world-grid" class="world-grid"></div>
  </section>

  <section id="scr-scores" class="screen hidden">
    <header class="scr-head">
      <button class="round-btn back home" data-back="title" aria-label="Naar het hoofdmenu"><svg viewBox="0 0 24 24" width="26" height="26"><path d="M3 11.2 12 3.5l9 7.7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.5 10v9.5h4.8v-5.6h3.4v5.6h4.8V10" fill="currentColor"/></svg></button>
      <h2>Scorebord · top 10</h2>
    </header>
    <div class="tabs">
      <button class="tab active" data-tab="global">Iedereen</button>
      <button class="tab" data-tab="local">Op dit apparaat</button>
    </div>
    <div class="tabs small">
      <button class="tab ptab active" data-players="1">1 speler</button>
      <button class="tab ptab" data-players="2">2 spelers</button>
    </div>
    <div id="score-list" class="score-list"></div>
  </section>

</div>

<!-- Modal -->
<div id="modal" class="hidden"><div class="modal-card" id="modal-card"></div></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
