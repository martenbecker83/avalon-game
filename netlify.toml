[build]
  publish = "."
  functions = "netlify/functions"
  command = "echo 'geen build nodig'"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# beginscherm-apps op de iPad bewaren bestanden graag lang: altijd eerst controleren of er een nieuwe versie is
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache"
